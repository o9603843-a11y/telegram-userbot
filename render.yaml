services:
  - type: web
    name: telegram-userbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: AUTO_REPLY_TEXT
        sync: false
      - key: NOTIFY_ME
        value: "True"
